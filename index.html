        :root {

            --glass-border: rgba(0, 119, 204, 0.2);

        body.light-mode {
            background-image:
                radial-gradient(ellipse at 25% 0%, rgba(0, 119, 204, .04) 0%, transparent 50%),
                radial-gradient(ellipse at 65% 85%, rgba(92, 31, 201, .03) 0%, transparent 50%),

            opacity: 0;

            color: #fff;

            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        body {

            background: var(--bg);
            color: var(--text);

            min-height: 100dvh;
            overflow-x: hidden;

                radial-gradient(ellipse at 65% 85%, rgba(123, 47, 255, .05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 45, 149, .035) 0%, transparent 45%);
            background-attachment: fixed;
            position: relative;
            transition: background .4s ease, color .4s ease;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: .025;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 240, 255, 0.35) 2px,
                    rgba(0, 240, 255, 0.35) 3px);
            animation: scanlines 8s linear infinite;
            transition: opacity .4s ease;

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(6px);
            }

            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            transform: translateZ(0);
            transition: background .4s ease, border-color .4s ease;

        .glass-card {

            backdrop-filter: blur(20px) saturate(180%);

            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            transform: translateZ(0);
            transition: all var(--ease);
            position: relative;
            overflow: hidden;
        }
        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.45), transparent);
            opacity: 0;
            transition: opacity var(--ease);
            pointer-events: none;

        .glass-card:hover::after {

            box-shadow: 0 -8px 32px rgba(0, 0, 0, .5);
            transition: background .4s ease, border-color .4s ease;

        .page {
            display: none;

            animation: fadeInUp .35s ease;

            margin: 0 auto;

            display: block;

        .topbar {
            display: flex;
            justify-content: space-between;

            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: .4;

            font-weight: 900;

            height: 100px;
