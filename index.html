<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TaskEarn ⚡</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11189424' data-sdk='show_11189424'></script>
<style>
:root{
--bg:#0e0e12;--surface:#14141a;--neon:#00e676;--neon-glow:rgba(0,230,118,.55);--neon-soft:rgba(0,230,118,.15);
--gold:#ffd700;--gold-glow:rgba(255,215,0,.5);--danger:#ff1744;--danger-glow:rgba(255,23,68,.6);
--text:#e0e0e0;--hint:#888;--radius-sm:10px;--radius:14px;--radius-lg:18px;--radius-xl:22px;--nav-height:74px;
--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Arabic',sans-serif;
--ease:0.25s cubic-bezier(0.4,0,0.2,1);
--glass-bg:rgba(20,20,30,0.7);--glass-border:rgba(0,230,118,0.18);--glass-hover:rgba(0,230,118,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(ellipse at 30% 10%,rgba(0,230,118,.06) 0%,transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(0,230,118,.04) 0%,transparent 55%);background-attachment:fixed;}
.glass{background:var(--glass-bg);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-border);transform:translateZ(0);}
.glass-card{background:var(--glass-bg);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius-lg);transform:translateZ(0);transition:border-color var(--ease),box-shadow var(--ease);}
.glass-nav{background:rgba(10,10,16,.94);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-top:1px solid var(--glass-border);transform:translateZ(0);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 15px var(--neon-glow),0 0 45px rgba(0,230,118,.15);}50%{box-shadow:0 0 30px var(--neon-glow),0 0 80px rgba(0,230,118,.35);}}
@keyframes pulse-glow-gold{0%,100%{box-shadow:0 0 12px var(--gold-glow),0 0 35px rgba(255,215,0,.12);}50%{box-shadow:0 0 28px var(--gold-glow),0 0 65px rgba(255,215,0,.3);}}
@keyframes shake{0%,100%{transform:rotate(0);}20%{transform:rotate(-5deg);}40%{transform:rotate(5deg);}60%{transform:rotate(-3deg);}80%{transform:rotate(3deg);}}
@keyframes burst{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:.5;}100%{transform:scale(.2);opacity:0;}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0);}50%{opacity:1;transform:scale(1) rotate(180deg);}}
@keyframes notifIn{from{top:-70px;opacity:0;transform:translateX(-50%) scale(.9);}to{top:18px;opacity:1;transform:translateX(-50%) scale(1);}}
@keyframes notifOut{from{top:18px;opacity:1;transform:translateX(-50%) scale(1);}to{top:-70px;opacity:0;transform:translateX(-50%) scale(.9);}}
@keyframes ticker-scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
@keyframes coin-pop{0%{transform:scale(1);}40%{transform:scale(1.4);}100%{transform:scale(1);}}
@keyframes ball-float{0%,100%{transform:translateY(0) scale(1);}30%{transform:translateY(-18px) scale(1.08);}60%{transform:translateY(-6px) scale(1.03);}}
@keyframes nav-game-pulse{0%,100%{box-shadow:0 0 22px var(--neon-glow),0 0 55px rgba(0,230,118,.35);}50%{box-shadow:0 0 45px var(--neon-glow),0 0 100px rgba(0,230,118,.65);}}
@keyframes gauge-pulse{0%,100%{box-shadow:0 0 8px rgba(0,230,118,.4),0 0 20px rgba(255,23,68,.3);}50%{box-shadow:0 0 18px rgba(0,230,118,.7),0 0 40px rgba(255,23,68,.55);}}
@keyframes spin{to{transform:rotate(360deg);}}
.coin-pop{animation:coin-pop .4s ease-out;}
.page{display:none;padding:12px 14px;padding-bottom:calc(var(--nav-height) + 20px);animation:fadeInUp .3s ease;max-width:480px;margin:0 auto;}
.page.active{display:block;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px;border-radius:var(--radius-lg);}
.logo{font-size:19px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:6px;}
.logo .bolt{display:inline-block;animation:float 2.5s ease-in-out infinite;filter:drop-shadow(0 0 12px var(--neon-glow));font-size:22px;}
.logo .txt{background:linear-gradient(135deg,#00e676,#69f0ae,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;}
.id-chip{font-size:11px;padding:6px 14px;border-radius:20px;color:var(--hint);letter-spacing:.3px;font-weight:500;background:var(--glass-bg);backdrop-filter:blur(10px);border:1px solid rgba(0,230,118,.2);}
.hero{text-align:center;padding:10px 16px 6px;}
.coin-wrap{display:inline-block;animation:float 3s ease-in-out infinite;}
.coin-ico{font-size:76px;filter:drop-shadow(0 8px 25px var(--neon-glow));display:block;}
.coin-num{font-size:52px;font-weight:900;letter-spacing:-2px;margin-top:4px;background:linear-gradient(180deg,#fff 0%,rgba(200,255,220,.85) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.coin-usdt{font-size:12px;color:var(--hint);margin-top:2px;letter-spacing:.5px;}
.prog-wrap{margin:14px 20px 0;height:6px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.06);}
.prog{height:100%;border-radius:10px;background:linear-gradient(90deg,#00e676,#69f0ae,#ffd700);transition:width .7s cubic-bezier(.4,0,.2,1);box-shadow:0 0 18px var(--neon-glow);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px;}
.stat{text-align:center;padding:14px 8px;border-radius:var(--radius);}
.stat-n{font-size:23px;font-weight:800;letter-spacing:-.5px;color:#00e676;text-shadow:0 0 12px var(--neon-glow);}
.stat-l{font-size:10px;color:var(--hint);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
.card{padding:16px;margin-bottom:10px;border-radius:var(--radius-lg);}
.card-h{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:#00e676;text-shadow:0 0 8px rgba(0,230,118,.3);}
.card-h .ico{font-size:20px;}
.ad-box{padding:22px;text-align:center;margin-bottom:10px;border-radius:var(--radius-xl);animation:pulse-glow-gold 3s infinite;position:relative;overflow:hidden;background:rgba(20,25,18,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,.25);}
.ad-pts{font-size:42px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#00e676,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ad-sub{font-size:13px;color:var(--hint);margin-bottom:6px;}
.ad-btn{width:100%;padding:14px;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;color:#0e0e12;border:none;background:linear-gradient(135deg,#00e676,#69f0ae);box-shadow:0 4px 25px rgba(0,230,118,.4);margin-top:12px;transition:all var(--ease);}
.ad-btn:active{transform:scale(.96);}
.ad-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.ad-info{font-size:11px;color:var(--hint);margin-top:8px;}
.task{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:var(--radius);margin-bottom:7px;cursor:pointer;transition:all var(--ease);background:var(--glass-bg);border:1px solid var(--glass-border);}
.task:active{transform:scale(.97);background:var(--glass-hover);}
.task.done{opacity:.3;pointer-events:none;filter:grayscale(40%);}
.task-l{display:flex;align-items:center;gap:12px;}
.task-ico{font-size:30px;}
.task-name{font-size:14px;font-weight:600;}
.task-desc{font-size:11px;color:var(--hint);margin-top:2px;}
.badge{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.3);color:#00e676;}
.ticker-wrap{padding:10px 14px;border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.ticker-label{font-size:10px;color:var(--hint);margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;}
.ticker-inner{overflow:hidden;white-space:nowrap;}
.ticker-track{white-space:nowrap;animation:ticker-scroll 22s linear infinite;font-size:11px;color:#00e676;display:inline-block;}
.checkin-strip{display:flex;justify-content:space-between;gap:5px;padding:4px 0;}
.checkin-day{flex:1;text-align:center;padding:9px 3px;border-radius:var(--radius-sm);}
.checkin-day .day-num{font-size:9px;color:var(--hint);margin-bottom:2px;}
.checkin-day .day-dot{width:28px;height:28px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid rgba(255,255,255,.1);background:rgba(20,25,20,.5);}
.checkin-day.checked .day-dot{background:linear-gradient(135deg,#00e676,#69f0ae);border-color:#00e676;box-shadow:0 0 18px var(--neon-glow);color:#0e0e12;}
.checkin-day.today .day-dot{border-color:#00e676;box-shadow:0 0 25px var(--neon-glow);}
.checkin-day .day-reward{font-size:9px;color:var(--hint);margin-top:3px;}
.checkin-day.checked .day-reward{color:#00e676;}
.mystery-box-wrap{text-align:center;padding:22px 16px;cursor:pointer;position:relative;transition:all var(--ease);}
.mystery-box-wrap:active{transform:scale(.95);}
.mystery-box-wrap.ready .mystery-ico{animation:shake .7s ease-in-out infinite;}
.mystery-box-wrap.opening .mystery-ico{animation:burst .5s ease-out forwards;}
.mystery-ico{font-size:74px;display:block;filter:drop-shadow(0 0 30px rgba(0,230,118,.65));}
.mystery-label{font-size:14px;font-weight:600;margin-top:10px;}
.mystery-sub{font-size:11px;color:var(--hint);margin-top:3px;}
.mystery-sparkles{position:absolute;pointer-events:none;inset:0;}
.sparkle{position:absolute;font-size:16px;animation:sparkle 1.5s ease-in-out infinite;opacity:0;}
.sparkle:nth-child(1){top:10%;left:15%;}.sparkle:nth-child(2){top:5%;right:15%;animation-delay:.4s;}.sparkle:nth-child(3){bottom:20%;left:10%;animation-delay:.8s;}.sparkle:nth-child(4){bottom:10%;right:12%;animation-delay:1.2s;}
.ref-box{padding:14px;border-radius:var(--radius);font-size:11px;word-break:break-all;margin:8px 0;line-height:1.7;color:rgba(180,220,180,.9);font-family:'SF Mono','Courier New',monospace;background:rgba(20,25,20,.5);border:1px solid rgba(0,230,118,.2);}
.btn{width:100%;padding:14px;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:all var(--ease);border:none;}
.btn:active{transform:scale(.96);}
.btn-gold{color:#0e0e12;background:linear-gradient(135deg,#00e676,#69f0ae);box-shadow:0 4px 22px rgba(0,230,118,.35);}
.btn-ghost{color:var(--hint);background:transparent;border:1px solid var(--glass-border);}
.btn:disabled{opacity:.5;pointer-events:none;}
#ton-connect-container{margin:10px 0;display:flex;justify-content:center;min-height:48px;align-items:center;}
.wallet-connected{text-align:center;padding:12px;border-radius:var(--radius);background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);font-size:12px;color:#00e676;word-break:break-all;margin:8px 0;}
.wallet-addr{font-size:11px;color:var(--hint);margin-top:4px;word-break:break-all;}

/* ===== NAV مع SVG icons احترافية ===== */
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px max(8px,env(safe-area-inset-bottom,8px));z-index:100;max-width:480px;margin:0 auto;border-radius:var(--radius-xl) var(--radius-xl) 0 0;}
.nb{background:none;border:none;color:var(--hint);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;transition:all var(--ease);border-radius:var(--radius);position:relative;flex:1;min-width:0;}
.nb svg{width:21px;height:21px;transition:all var(--ease);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.nb.on{color:#00e676;font-weight:600;text-shadow:0 0 10px var(--neon-glow);}
.nb.on svg{filter:drop-shadow(0 0 8px var(--neon-glow));transform:scale(1.12);stroke-width:2.3;}
.nb.on::after{content:'';position:absolute;top:-4px;width:16px;height:3px;border-radius:4px;background:#00e676;box-shadow:0 0 14px var(--neon-glow);}
.nb-game{position:relative;margin-top:-32px;z-index:110;background:linear-gradient(135deg,#00e676,#00c853);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;animation:nav-game-pulse 2.2s ease-in-out infinite;box-shadow:0 0 30px var(--neon-glow),0 0 70px rgba(0,230,118,.45);cursor:pointer;border:3px solid rgba(255,255,255,.25);transition:all var(--ease);flex-shrink:0;}
.nb-game:active{transform:scale(.9);}
.nb-game .ball-emoji{font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
.nb-game.on{animation:nav-game-pulse 1.4s ease-in-out infinite;box-shadow:0 0 50px var(--neon-glow),0 0 110px rgba(0,230,118,.7);border-color:#fff;}

.notif{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:28px;font-size:14px;font-weight:700;z-index:999;display:none;white-space:nowrap;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.7);max-width:90vw;text-align:center;backdrop-filter:blur(20px);background:rgba(20,20,30,.9);}
.notif.success{color:#00e676;border:1px solid rgba(0,230,118,.5);}
.notif.error{color:#ff1744;border:1px solid rgba(255,23,68,.5);}
.notif.info{color:#00e676;border:1px solid rgba(0,230,118,.4);}
.lang-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.lang-i{padding:12px;border-radius:var(--radius);text-align:center;cursor:pointer;font-size:13px;background:var(--glass-bg);border:1px solid var(--glass-border);transition:all var(--ease);}
.lang-i:active{transform:scale(.95);}
.lang-i.on{border-color:#00e676!important;background:rgba(0,230,118,.15)!important;color:#00e676;box-shadow:0 0 22px rgba(0,230,118,.25);}
#verify-btn{position:fixed;bottom:90px;z-index:200;padding:14px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:none;width:calc(100% - 28px);max-width:452px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#00e676,#69f0ae);color:#0e0e12;box-shadow:0 0 28px rgba(0,230,118,.55);}
.info-row{font-size:11px;color:var(--hint);display:flex;align-items:center;gap:6px;padding:3px 0;}

/* Game */
.field{position:relative;width:100%;aspect-ratio:1.4/1;max-height:320px;border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(180deg,#0a2a0f 0%,#0d3314 30%,#0a2a0f 60%,#0d3314 100%);border:2px solid rgba(0,230,118,.35);box-shadow:0 0 40px rgba(0,230,118,.2),inset 0 0 80px rgba(0,0,0,.5);margin:0 auto 14px;}
.field-lines{position:absolute;inset:0;pointer-events:none;}
.field-line{position:absolute;background:rgba(0,230,118,.35);}
.field-line.center{top:50%;left:0;right:0;height:2px;}
.field-line.circle{top:50%;left:50%;width:100px;height:100px;border-radius:50%;background:transparent;border:2px solid rgba(0,230,118,.35);transform:translate(-50%,-50%);}
.field-line.penalty-top{top:8%;left:25%;right:25%;height:25%;border:2px solid rgba(0,230,118,.3);border-top:none;border-radius:0 0 20px 20px;}
.field-line.penalty-bottom{bottom:8%;left:25%;right:25%;height:25%;border:2px solid rgba(0,230,118,.3);border-bottom:none;border-radius:20px 20px 0 0;}
.field-dot{position:absolute;width:8px;height:8px;background:rgba(0,230,118,.6);border-radius:50%;}
.field-dot.center-dot{top:50%;left:50%;transform:translate(-50%,-50%);}
.ball-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;animation:ball-float 3s ease-in-out infinite;transition:filter .3s ease;}
.ball-container.win{animation:ball-float .6s ease-in-out infinite;filter:drop-shadow(0 0 35px #00e676) drop-shadow(0 0 80px #00e676)!important;}
.ball-container.lose{animation:shake .5s ease-in-out;filter:drop-shadow(0 0 35px #ff1744) drop-shadow(0 0 80px #ff1744)!important;}
.ball{font-size:60px;display:block;filter:drop-shadow(0 0 20px rgba(0,230,118,.5));}
.gauge-wrap{display:flex;align-items:center;justify-content:center;margin:0 auto 16px;position:relative;height:48px;max-width:340px;border-radius:24px;overflow:hidden;animation:gauge-pulse 2.5s ease-in-out infinite;}
.gauge-low{flex:1;height:100%;background:linear-gradient(180deg,rgba(0,230,118,.7),rgba(0,200,100,.85));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0e0e12;border-radius:24px 0 0 24px;}
.gauge-high{flex:1;height:100%;background:linear-gradient(180deg,rgba(255,23,68,.7),rgba(255,50,80,.85));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;border-radius:0 24px 24px 0;}
.gauge-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#0e0e12;border:3px solid rgba(255,215,0,.8);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#ffd700;box-shadow:0 0 20px var(--gold-glow);z-index:2;}
.game-btns{display:flex;gap:12px;margin-bottom:16px;max-width:340px;margin-left:auto;margin-right:auto;}
.game-btn{flex:1;padding:16px;border-radius:var(--radius-lg);font-size:18px;font-weight:800;cursor:pointer;border:none;transition:all var(--ease);}
.game-btn.low-btn{background:linear-gradient(135deg,#00c853,#00e676);color:#0e0e12;box-shadow:0 4px 30px rgba(0,230,118,.5);}
.game-btn.high-btn{background:linear-gradient(135deg,#d50000,#ff1744);color:#fff;box-shadow:0 4px 30px rgba(255,23,68,.5);}
.game-btn:active{transform:scale(.93);}
.game-btn:disabled{opacity:.4;pointer-events:none;}
.bet-section{max-width:340px;margin:0 auto;text-align:center;}
.bet-input-wrap{position:relative;margin-bottom:10px;}
.bet-input{width:100%;padding:14px 18px;border-radius:var(--radius-lg);background:rgba(20,25,20,.7);border:2px solid rgba(0,230,118,.35);color:#fff;font-size:22px;font-weight:800;text-align:center;font-family:var(--font);}
.bet-input:focus{outline:none;border-color:#00e676;box-shadow:0 0 30px rgba(0,230,118,.35);}
.bet-label{font-size:10px;color:var(--hint);text-transform:uppercase;margin-bottom:4px;}
.bet-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.bet-ctrl{padding:10px 6px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;border:1px solid rgba(0,230,118,.3);background:rgba(0,230,118,.08);color:#00e676;}
.bet-ctrl:active{background:rgba(0,230,118,.25);transform:scale(.94);}
.bet-ctrl.max-btn{border-color:rgba(255,215,0,.5);color:#ffd700;background:rgba(255,215,0,.08);}
.bet-ctrl.min-btn{border-color:rgba(255,255,255,.4);color:#ccc;background:rgba(255,255,255,.05);}
.game-history{max-width:340px;margin:12px auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.game-history-dot{width:22px;height:22px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.game-history-dot.win-dot{background:rgba(0,230,118,.25);color:#00e676;border:1px solid rgba(0,230,118,.5);}
.game-history-dot.lose-dot{background:rgba(255,23,68,.25);color:#ff1744;border:1px solid rgba(255,23,68,.5);}
[dir="rtl"] .ticker-track{animation-direction:reverse;}
[dir="rtl"] .prog{background:linear-gradient(270deg,#00e676,#69f0ae,#ffd700);}

/* ===== صفحة المهام/Shortlinks ===== */
.offer-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:all var(--ease);backgr
